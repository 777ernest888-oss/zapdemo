<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VIN-запрос - Автозапчасти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;margin:0;padding:64px 12px 12px;background:#f5f5f5}
.hd{position:fixed;top:0;left:0;right:0;background:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;gap:8px;align-items:center;z-index:10}
.hd a{background:#667eea;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px}
.hd b{flex:1;text-align:center}
label{display:block;margin:10px 0 4px;font-size:14px;color:#555}
input,textarea{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
textarea{min-height:90px}
.btn{display:block;width:100%;margin-top:16px;background:#667eea;color:#fff;border:0;padding:14px;border-radius:10px;font-size:16px;font-weight:600}
.ok{background:#e8f5e9;border:1px solid #1a7f3c;color:#1a7f3c;border-radius:10px;padding:16px;margin-top:16px;display:none}
</style>
</head>
<body>
<div class="hd"><a href="index.html">← Главная</a><b>🔍 VIN-запрос</b></div>
<label>VIN (необязательно)</label>
<input id="vin" placeholder="Например: LVSFCB3C7FG000001">
<label>Что нужно запчасть *</label>
<textarea id="desc" placeholder="Например: колодки тормозные передние"></textarea>
<label>Контакт для связи</label>
<input id="contact" placeholder="Телефон или @username">
<button class="btn" onclick="send()">Отправить заявку</button>
<div class="ok" id="ok">✅ Заявка отправлена! Владелец свяжется с вами.</div>
<script>
function send(){
var desc=document.getElementById('desc').value.trim();
if(!desc){alert('Укажите, что нужно');return;}
fetch('/api/requests',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({vin:document.getElementById('vin').value.trim(),description:desc,contact:document.getElementById('contact').value.trim()})})
.then(function(r){return r.json();})
.then(function(d){
if(d.ok){document.getElementById('ok').style.display='block';}
else{alert('Ошибка: '+(d.error||'неизвестно'));}
})
.catch(function(e){alert('Ошибка связи: '+e.message);});
}
Telegram.WebApp.ready();
</script>
</body>
</html>
