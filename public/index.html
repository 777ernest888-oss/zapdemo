<!doctype html>
<html lang="ru">
<head>

<title>Автозапчасти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;font-family:system-ui;background:#f5f5f5}
.hero{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;text-align:center;padding:12px 10px}
.hero img{width:94%;max-width:430px;height:auto;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
.hero h1{font-size:clamp(18px,5.5vw,24px);margin:10px 0 8px}
.ft{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:460px;margin:0 auto}
.ft div{background:rgba(255,255,255,.15);border-radius:10px;padding:clamp(7px,2vh,12px);font-size:clamp(11px,3.2vw,14px)}
.cta{display:block;margin:10px 16px;background:#ffd700;color:#333;padding:clamp(12px,2vh,18px);border-radius:14px;font-weight:700;font-size:clamp(15px,4.5vw,19px);text-decoration:none;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.2)}
</style>
</head>
<body>
<div class="hero">
<img src="images/hero.jpg" alt="">
<h1>Запчасти для любых китайских авто</h1>
<div class="ft">
<div>📦 В наличии и под заказ</div>
<div>🔍 Поиск по VIN</div>
<div>✅ Гарантия</div>
<div>💰 Низкие цены</div>
</div>
</div>

Telegram.WebApp.ready();
</script>

</html>
