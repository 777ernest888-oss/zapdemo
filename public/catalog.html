<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Каталог - Автозапчасти</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{font-family:system-ui;margin:0;padding:64px 12px 12px;background:#f5f5f5}
.hd{position:fixed;top:0;left:0;right:0;background:#fff;padding:10px 12px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;gap:8px;align-items:center;z-index:10}
.hd a{background:#667eea;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px}
.hd b{flex:1;text-align:center}
input,select{width:100%;padding:10px;font-size:16px;border:1px solid #ccc;border-radius:6px;box-sizing:border-box;margin:4px 0}
.item{background:#fff;border-radius:8px;padding:12px;margin:8px 0}
.price{color:#1a7f3c;font-weight:700}
.cb{color:#667eea;font-size:13px}
</style>
</head>
<body>
<div class="hd"><a href="index.html">← Главная</a><b>🚗 Каталог</b><a href="vin.html?v=2" style="background:#ffd700;color:#333;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px">🔍 VIN</a></div>
<input id="q" type="search" placeholder="Артикул или название">
<select id="cb"><option value="">Все марки авто</option></select>
<div id="list"></div>
<script>
var list=document.getElementById('list'),q=document.getElementById('q'),cb=document.getElementById('cb'),t;
q.addEventListener('input',function(){clearTimeout(t);t=setTimeout(load,300);});
cb.addEventListener('change',load);
function load(){
var url='/api/products?q='+encodeURIComponent(q.value)+'&limit=50';
if(cb.value)url+='&car_brand='+encodeURIComponent(cb.value);
fetch(url).then(function(r){return r.json();}).then(function(d){
list.innerHTML=d.items.map(function(p){
return '<div class="item"><b>'+p.article+'</b> — '+p.name+'<div class="cb">'+(p.car_brand||'')+' · '+p.brand+'</div><div class="price">'+p.price+' ₽ · наличие: '+p.stock+'</div></div>';
}).join('')||'<p>Пока пусто</p>';
});
}
fetch('/api/products/car_brands').then(function(r){return r.json();}).then(function(a){
cb.innerHTML='<option value="">Все марки авто</option>'+a.map(function(b){return '<option>'+b+'</option>';}).join('');
});
load();
Telegram.WebApp.ready();
</script>
</body>
</html>
