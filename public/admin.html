<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<style>
body{font-family:system-ui;margin:0;padding:12px;background:#f5f5f5}
h1{font-size:20px}
h2{font-size:16px;margin:14px 0 6px}
.nav{margin:8px 0}
.nav a{display:inline-block;background:#667eea;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px;margin-right:6px}
input{width:100%;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#667eea;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px 2px;cursor:pointer}
button.red{background:#d33}
button.gray{background:#999}
.tab{background:#ddd;color:#333;font-weight:600}
.tab.active{background:#333;color:#fff}
.card{background:#fff;border-radius:8px;padding:10px;margin:8px 0}
.hide{display:none}
.err{color:#d33;margin:6px 0}
.ok{color:#1a7f3c;margin:6px 0}
.row{font-size:14px;margin:4px 0}
.mode{background:#333;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
</style>
<style>body{background:#f2f4f8}input,textarea,select{width:100%;padding:10px 12px;margin:5px 0;border:1px solid #d8dce6;border-radius:10px;font-size:14px;background:#fff}input:focus,textarea:focus{outline:2px solid #667eea}button{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#667eea;color:#fff;margin:4px 4px 4px 0}h2,h3{letter-spacing:.2px}</style>
<style>textarea{width:100%!important;box-sizing:border-box;min-height:110px}</style></head>
<body>
<div class="nav"><a id="nav_main" href="index.html?v=37">← Главная</a><a id="nav_cat" href="catalog.html?v=37">🛒 Каталог</a></div>
<h1>⚙️ Админ-панель</h1>
<div id="login">
<input id="pass" type="password" placeholder="Пароль администратора">
<button onclick="doLogin()">Войти</button>
<div class="err" id="lerr"></div>
</div>
<div id="app" class="hide">
<div class="mode">Вы в режиме администратора</div><div id="trial_banner" hidden style="background:#fef3c7;color:#92400e;border-radius:10px;padding:10px;margin:8px 10px;font-weight:600"></div>
<div id="pwbanner" class="err hide">⚠️ Действует пароль по умолчанию — смените в «Настройках»</div>
<div>
<button id="tabP" class="tab active" onclick="tab('p')">📦 Товары</button>
<button id="tabR" class="tab" onclick="tab('r')">📋 Заявки</button>
<button id="tabS" class="tab" onclick="tab('s')">⚙️ Настройки</button>
<button class="gray" onclick="window.open('catalog.html?v=37&tenant='+TID,'_blank')">📤 Каталог</button> <button class="gray" onclick="shareCatalog()">🔗 Поделиться</button>
<button class="gray" onclick="logout()">Выход</button>
</div>
<div id="msg"></div>
<div id="sec-p">
<h2>Новый товар</h2>
<input id="f_article" placeholder="Артикул (необязательно)">
<input id="f_name" placeholder="Название *">
<input id="f_price" type="number" placeholder="Цена *">
<select id="f_avail"><option value="">— не выбрано —</option><option value="in">В наличии</option><option value="out">Под заказ</option></select>
<input id="f_stock" type="number" placeholder="Количество, шт">
<select id="f_category"></select><input id="f_category_new" placeholder="Новая категория — появится в списке после сохранения" style="display:none;margin-top:6px">
<select id="f_brand"></select><input id="f_brand_new" placeholder="Новый бренд — появится в списке после сохранения" style="display:none;margin-top:6px">
<select id="f_car"></select>
<div style="font-size:12px;color:#556;margin:8px 0 2px;font-weight:600">Модель авто</div><select id="f_model"></select>
<input id="f_car_new" placeholder="Новая марка — появится в списке после сохранения" style="display:none;margin-top:6px">
<input id="f_model_new" placeholder="Новая модель — появится в списке после сохранения" style="display:none;margin-top:6px">
<div style="margin:10px 0"><label style="font-weight:700">📷 Фото товара</label> <span style="color:#888;font-size:12px">(файл с ПК/телефона, сожмётся при загрузке)</span><br><input type="file" id="f_file" accept="image/*" style="width:auto;margin:6px 0" onchange="prepPhoto(this)"><br><img id="f_prev" style="max-height:70px;border-radius:8px;margin-top:4px" hidden><input type="hidden" id="f_photo_url"></div><button onclick="saveProd()">Сохранить</button>
<h2>Список товаров</h2>
<div id="plist"></div>
<div class="card">
<h2>📥 Импорт Excel</h2>
<input type="file" id="f_file" accept=".xlsx,.xls">
<button onclick="doImport()">Импортировать</button>
<div id="otkat" style="margin:10px 0;padding:10px;background:#f5f5f5;border-radius:10px">
<h3>🔄 Откаты</h3>
<button onclick="undoImport()">Отменить импорт</button>
<select id="bk_list" style="margin:0 6px"></select><button onclick="doRestore()">Восстановить из бэкапа</button>
<button onclick="resetSettings()">Сбросить настройки</button>
</div>
<button class="gray" onclick="dlTemplate()">Скачать шаблон</button>
<div id="imp_rep"></div>
</div>
</div>
<div id="sec-r" class="hide">
<h2>VIN-заявки</h2>
<div id="rlist"></div>
</div>
<div id="sec-s" class="hide">
<h2>Настройки</h2>
<input id="s_brand" placeholder="Название бренда">
<input id="s_phone" placeholder="Телефон">
<input id="s_tg" placeholder="Telegram для заявок (chat id, узнать у @userinfobot)">
<input id="s_contact" placeholder="Контакты (TG)">
<input id="s_about" placeholder="О компании">
<input id="s_pass" type="password" placeholder="Новый пароль (если сменить, мин. 8 символов)">
<input id="s_pass2" type="password" placeholder="Повторите новый пароль">
<button onclick="saveS()">Сохранить настройки</button>
<div id="brand_block" style="margin:12px 0;padding:12px;background:#f5f5f5;border-radius:10px"><h3>🎨 Бренд и внешний вид</h3><input id="b_shop" placeholder="Название магазина" style="width:100%;margin:4px 0"><input id="b_slogan" placeholder="Слоган" style="width:100%;margin:4px 0"><textarea id="b_phone" rows="2" placeholder="Телефоны (по одному в строке)" style="width:100%;margin:4px 0"></textarea><input id="b_hero" placeholder="URL картинки hero" style="width:100%;margin:4px 0"><div style="margin:6px 0">Основной <input type="color" id="b_c1"> Акцентный <input type="color" id="b_c2"></div><button onclick="saveBrand()">Сохранить внешний вид</button></div>
</div>
</div>
<script>
var PASS=sessionStorage.getItem('apass')||'';
var editId=null;
var TID=new URLSearchParams(location.search).get('tenant')||'demo';function hdr(){return {'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID};}
document.getElementById('nav_main').href='index.html?v=37&tenant='+TID;document.getElementById('nav_cat').href='catalog.html?v=37&tenant='+TID;
function doLogin(){
PASS=document.getElementById('pass').value;
fetch('/admin/products',{headers:hdr()}).then(function(r){
if(r.ok){sessionStorage.setItem('apass',PASS);show();}
else{document.getElementById('lerr').textContent='Неверный пароль';}
});
}
function logout(){sessionStorage.removeItem('apass');location.reload();}
function show(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');loadP();loadR();checkPass();}
function tab(t){
document.getElementById('sec-p').classList.toggle('hide',t!='p');
document.getElementById('sec-r').classList.toggle('hide',t!='r');
document.getElementById('sec-s').classList.toggle('hide',t!='s');
document.getElementById('tabP').classList.toggle('active',t=='p');
document.getElementById('tabR').classList.toggle('active',t=='r');
document.getElementById('tabS').classList.toggle('active',t=='s');
if(t=='s')loadS();
}
function msg(t,ok){var m=document.getElementById('msg');m.style.cssText='position:fixed;top:40%;left:50%;transform:translate(-50%,-50%);z-index:9999;min-width:240px;max-width:88%;text-align:center;';m.innerHTML='<div style="background:'+(ok?'#dcfce7':'#fee2e2')+';color:'+(ok?'#166534':'#991b1b')+';padding:14px 20px;border-radius:12px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.2);font-size:15px;">'+t+'</div>';setTimeout(function(){m.innerHTML='';m.style.cssText='';},3500);}
function clearForm(){
['f_article','f_name','f_price','f_avail','f_stock','f_category','f_brand','f_car','f_model'].forEach(function(i){document.getElementById(i).value='';});['f_brand_new','f_car_new','f_model_new'].forEach(function(i){var e=document.getElementById(i);if(e){e.value='';e.style.display='none';}});
editId=null;
}
function loadP(){
fetch('/admin/products',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
if(a.error){msg(a.error,false);return;}
document.getElementById('plist').innerHTML=a.map(function(p){
return '<div class="card"><div class="row"><b>'+p.article+'</b> — '+p.name+'</div><div class="row">'+(p.car_brand||'')+' · '+(p.brand||'')+' · '+p.price+' ₽ · налич:'+p.stock+'</div><button class="gray" onclick="editProd('+p.id+')">Ред.</button><button class="red" onclick="delProd('+p.id+')">Удалить</button><button class="gray" onclick="copyLink(\''+p.article+'\')">🔗</button><button class="gray" onclick="shareTg(\''+p.article+'\')">📤</button></div>';
}).join('')||'<p>Пусто</p>';window._prods=a;fillDicts();
});
}
function saveProd(){
var b={
article:document.getElementById('f_article').value.trim(),
name:document.getElementById('f_name').value.trim(),
price:document.getElementById('f_price').value===''?null:Number(document.getElementById('f_price').value),
avail:(function(){var a=document.getElementById('f_avail');return a&&a.value?a.value:null;})(),stock:document.getElementById('f_stock').value===''?0:Number(document.getElementById('f_stock').value),
category:document.getElementById('f_category').value.trim()||null,
brand:(function(){var bn=document.getElementById('f_brand_new');if(bn&&bn.style.display!=='none'&&bn.value.trim())return bn.value.trim();return document.getElementById('f_brand').value.trim()||null;})(),
car_brand:(function(){var cn=document.getElementById('f_car_new');if(cn&&cn.style.display!=='none'&&cn.value.trim())return cn.value.trim();return document.getElementById('f_car').value.trim()||null;})(),model:(function(){var mn=document.getElementById('f_model_new');if(mn&&mn.style.display!=='none'&&mn.value.trim())return mn.value.trim();var ms=document.getElementById('f_model');return ms&&ms.value.trim()?ms.value.trim():null;})(), country:document.getElementById('f_country').value.trim(),
photo_url:document.getElementById('f_photo_url').value||null,
description:(document.getElementById('f_desc')?document.getElementById('f_desc').value:'')||null
};
var url='/admin/products',method='POST';
if(editId){url='/admin/products/'+editId;method='PUT';}
fetch(url,{method:method,headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){
if(d.ok){msg('Сохранено',true);clearForm();loadP();}
else{msg(d.error||'Ошибка',false);}
});
}
function delProd(id){
if(!confirm('Удалить товар?'))return;
fetch('/admin/products/'+id,{method:'DELETE',headers:hdr()}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg('Удалено',true);loadP();}});
}

function editProd(id){
fetch('/admin/products',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
var p=null;
for(var i=0;i<a.length;i++){if(a[i].id==id)p=a[i];}
if(!p)return;
editId=id;
document.getElementById('f_article').value=p.article;
document.getElementById('f_name').value=p.name;
document.getElementById('f_price').value=p.price;
document.getElementById('f_stock').value=p.stock;var av=document.getElementById('f_avail');if(av)av.value=p.avail||'';
document.getElementById('f_category').value=p.category||'';
document.getElementById('f_brand').value=p.brand||'';
document.getElementById('f_car').value=p.car_brand||''; document.getElementById('f_country').value=p.country||'';
(function(){var ms=document.getElementById('f_model');var mn=document.getElementById('f_model_new');var mv=p.model||'';var has=false;for(var o=0;o<ms.options.length;o++){if(ms.options[o].value===mv){has=true;break;}}if(mv&&!has){mn.value=mv;mn.style.display='';}else{ms.value=mv;mn.value='';mn.style.display='none';}})();
msg('Редактирование #'+id+' — измените и нажмите Сохранить',true);
window.scrollTo(0,0);
});
}
function loadR(){
fetch('/admin/requests',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
document.getElementById('rlist').innerHTML=a.map(function(x){
return '<div class="card"><div class="row"><b>#'+x.id+'</b> '+x.type+' · '+x.status+'</div><div class="row">VIN: '+(x.vin||'—')+'</div><div class="row">'+x.description+'</div><div class="row">Контакт: '+(x.contact||'—')+' <span class="badge" style="background:'+((x.push_status==='failed')?'#e74c3c':((x.push_status==='sent')?'#27ae60':'#95a5a6'))+'">'+(x.push_status||'—')+'</span></div><button class="red" onclick="delReq('+x.id+')">Удалить</button></div>';
}).join('')||'<p>Пусто</p>';
});
}
function delReq(id){
if(!confirm('Удалить заявку?'))return;
fetch('/admin/requests/'+id,{method:'DELETE',headers:hdr()}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg('Удалено',true);loadR();}});
}
function prodUrl(a){return 'https://zap.prostors.ru/catalog.html?article='+encodeURIComponent(a)+'&tenant='+TID;}
function copyLink(a){var u=prodUrl(a);if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){msg('Ссылка скопирована',true);});}else{prompt('Скопируйте ссылку:',u);}}
function shareTg(a){var u=prodUrl(a);window.open('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent('Запчасть: '+a),'_blank');}
function shareCatalog(){window.open('https://t.me/share/url?url='+encodeURIComponent('https://zap.prostors.ru/catalog.html?v=37&tenant='+TID)+'&text='+encodeURIComponent('Каталог автозапчастей'),'_blank');}
function loadS(){
fetch('/admin/settings',{headers:hdr()}).then(function(r){return r.json();}).then(function(s){
document.getElementById('s_brand').value=s.brand_name||'';
document.getElementById('s_phone').value=s.phone||'';document.getElementById('s_tg').value=s.tg_chat_id||'';
fetch('/admin/config',{headers:hdr()}).then(function(r){return r.json();}).then(function(c){if(c.plan==='trial'){var tb=document.getElementById('trial_banner');tb.hidden=false;tb.textContent='\u{1F552} Тестовый режим до '+String(c.expires_at||'').slice(0,10)+'. Активация подписки: @ernest_812';}});
document.getElementById('s_contact').value=s.contact_info||'';
document.getElementById('s_about').value=s.about||'';
});
}
function saveS(){
var b={brand_name:document.getElementById('s_brand').value,phone:document.getElementById('s_phone').value,tg_chat_id:document.getElementById('s_tg').value,contact_info:document.getElementById('s_contact').value,about:document.getElementById('s_about').value};
var np=document.getElementById('s_pass').value.trim();
if(np)b.new_password=np;
fetch('/admin/settings',{method:'POST',headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){
if(d.ok){msg('Настройки сохранены',true);document.getElementById('s_pass').value='';}
else{msg(d.error||'Ошибка',false);}
});
}
function doImport(){
var f=document.getElementById('f_file').files[0];
if(!f){msg('Выберите файл',false);return;}
var fd=new FormData();
fd.append('file',f);
fetch('/admin/import-excel',{method:'POST',headers:{'x-admin-pass':PASS,'x-tenant-id':TID},body:fd}).then(function(r){return r.json();}).then(function(d){
if(d.errors!==undefined){
document.getElementById('imp_rep').innerHTML='<div class="ok">Вставлено: '+d.inserted+' · Обновлено: '+d.updated+'</div>'+(d.errors.length?'<div class="err">Ошибки: '+d.errors.map(function(e){return 'стр.'+e.row+': '+e.error;}).join('; ')+'</div>':'');
loadP();
}else{msg(d.error||'Ошибка',false);}
});
}
function dlTemplate(){
fetch('/admin/excel-template',{headers:hdr()}).then(function(r){return r.blob();}).then(function(b){
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='template.xlsx';
a.click();
});
}
function checkPass(){fetch("/admin/settings",{headers:hdr()}).then(function(r){return r.json();}).then(function(x){document.getElementById("pwbanner").classList.toggle("hide",!!x.has_pass);var ot=document.getElementById('otkat');if(ot)ot.style.display=x.is_master?'':'none';});}
function saveS(){var np=document.getElementById("s_pass").value.trim();var np2=document.getElementById("s_pass2").value.trim();if(np){if(np.length<8){msg("Пароль минимум 8 символов",false);return;}if(np!==np2){msg("Пароли не совпадают",false);return;}}var b={brand_name:document.getElementById("s_brand").value,phone:document.getElementById("s_phone").value,tg_chat_id:document.getElementById("s_tg").value,contact_info:document.getElementById("s_contact").value,about:document.getElementById("s_about").value};if(np)b.new_password=np;fetch("/admin/settings",{method:"POST",headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg("Настройки сохранены",true);document.getElementById("s_pass").value="";document.getElementById("s_pass2").value="";checkPass();}else{msg(d.error||"Ошибка",false);}});}
if(PASS)show();
function loadBackups(){fetch('/admin/backups',{headers:{'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID}}).then(function(r){return r.json();}).then(function(d){var s=document.getElementById('bk_list');if(!s)return;s.innerHTML='';(d.files||[]).forEach(function(f){var o=document.createElement('option');o.value=f;o.textContent=f;s.appendChild(o);});});}
function undoImport(){if(!confirm('Отменить последний импорт?'))return;fetch('/admin/restore',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID},body:JSON.stringify({file:'pre-import.db'})}).then(function(){msg('Восстановление… контейнер перезапускается',true);setTimeout(function(){location.reload();},5000);});}
function doRestore(){var f=document.getElementById('bk_list').value;if(!f){msg('Выберите бэкап',false);return;}if(!confirm('Восстановить '+f+'?'))return;fetch('/admin/restore',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID},body:JSON.stringify({file:f})}).then(function(){msg('Восстановление… контейнер перезапускается',true);setTimeout(function(){location.reload();},5000);});}
function resetSettings(){if(!confirm('Сбросить настройки витрины к дефолту?'))return;fetch('/admin/reset-settings',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID}}).then(function(r){return r.json();}).then(function(){msg('Настройки сброшены',true);});}
if(PASS)loadBackups();
setInterval(function(){if(PASS&&document.getElementById('bk_list')&&document.getElementById('bk_list').options.length===0)loadBackups();},3000);
function loadBrand(){fetch('/admin/config',{headers:hdr()}).then(function(r){return r.json();}).then(function(c){window._cfg=c;document.getElementById('b_shop').value=c.shop_name||'';document.getElementById('b_slogan').value=c.slogan||'';document.getElementById('b_phone').value=c.phone||'';document.getElementById('b_hero').value=c.hero_url||'';document.getElementById('b_c1').value=c.color_primary||'#667eea';document.getElementById('b_c2').value=c.color_accent||'#764ba2';});}
function saveBrand(){var c=window._cfg||{};var b={shop_name:document.getElementById('b_shop').value,slogan:document.getElementById('b_slogan').value,phone:document.getElementById('b_phone').value.split('\n').map(function(x){return x.trim();}).filter(Boolean).join('\n'),contact_info:c.contact_info,about:c.about,payment_text:c.payment_text,delivery_text:c.delivery_text,hero_url:document.getElementById('b_hero').value,color_primary:document.getElementById('b_c1').value,color_accent:document.getElementById('b_c2').value,car_brands:c.car_brands||[],categories:c.categories||[]};fetch('/admin/config',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS,'x-tenant-id':TID},body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){if(d.ok){alert('Внешний вид сохранён');}else{alert(d.error||'Ошибка');}});}
if(PASS)loadBrand();
var DEMO=location.search.indexOf('demo=1')>=0;
if(DEMO){
var _origFetch=window.fetch;window._snap=null;
function loadSnap(){if(window._snap)return Promise.resolve(window._snap);return Promise.all([_origFetch.call(window,'/api/products?tenant=demo&limit=9999',{headers:{'Content-Type':'application/json'}}),_origFetch.call(window,'/api/config?tenant=demo',{headers:{'Content-Type':'application/json'}})]).then(function(rr){return Promise.all([rr[0].json(),rr[1].json()]);}).then(function(j){var prods=(j[0].items)||[];window._snap={products:prods,cfg:j[1],nextId:Math.max.apply(null,[0].concat(prods.map(function(x){return x.id;})))+1};return window._snap;});}
window.fetch=function(u,o){o=o||{};o.headers=o.headers||{};o.headers['x-demo']='1';var m=(o.method||'GET').toUpperCase();var us=String(u);
if(m!=='GET'&&us.indexOf('/admin/')>=0){var body=o.body;loadSnap().then(function(s){var b=null;try{b=body?JSON.parse(body):null;}catch(e){}
if(m==='POST'&&us.indexOf('/admin/products')>=0&&us.indexOf('import')<0){b=b||{};b.id=s.nextId++;s.products.push(b);}
else if(m==='PUT'&&/\/admin\/products\/\d+/.test(us)){var pid=parseInt(us.split('/').pop(),10);for(var i=0;i<s.products.length;i++){if(s.products[i].id===pid){Object.assign(s.products[i],b||{});break;}}}
