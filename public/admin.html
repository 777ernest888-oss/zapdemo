<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Админ-панель</title>
<style>
body{font-family:system-ui;margin:0;padding:12px;background:#f5f5f5}
h1{font-size:20px}
h2{font-size:16px;margin:14px 0 6px}
.nav{margin:8px 0}
.nav a{display:inline-block;background:#667eea;color:#fff;padding:8px 12px;border-radius:8px;text-decoration:none;font-size:14px;margin-right:6px}
input{width:100%;padding:8px;margin:4px 0;border:1px solid #ccc;border-radius:6px;box-sizing:border-box}
button{background:#667eea;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin:4px 2px;cursor:pointer}
button.red{background:#d33}
button.gray{background:#999}
.tab{background:#ddd;color:#333;font-weight:600}
.tab.active{background:#333;color:#fff}
.card{background:#fff;border-radius:8px;padding:10px;margin:8px 0}
.hide{display:none}
.err{color:#d33;margin:6px 0}
.ok{color:#1a7f3c;margin:6px 0}
.row{font-size:14px;margin:4px 0}
.mode{background:#333;color:#fff;border-radius:8px;padding:8px 12px;font-size:13px;margin:8px 0}
</style>
<style>body{background:#f2f4f8}input,textarea,select{width:100%;padding:10px 12px;margin:5px 0;border:1px solid #d8dce6;border-radius:10px;font-size:14px;background:#fff}input:focus,textarea:focus{outline:2px solid #667eea}button{border:none;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;background:#667eea;color:#fff;margin:4px 4px 4px 0}h2,h3{letter-spacing:.2px}</style>
</head>
<body>
<div class="nav"><a href="index.html?v=5">← Главная</a><a href="catalog.html?v=5">🛒 Каталог</a></div>
<h1>⚙️ Админ-панель</h1>
<div id="login">
<input id="pass" type="password" placeholder="Пароль администратора">
<button onclick="doLogin()">Войти</button>
<div class="err" id="lerr"></div>
</div>
<div id="app" class="hide">
<div class="mode">Вы в режиме администратора</div>
<div id="pwbanner" class="err hide">⚠️ Действует пароль по умолчанию — смените в «Настройках»</div>
<div>
<button id="tabP" class="tab active" onclick="tab('p')">📦 Товары</button>
<button id="tabR" class="tab" onclick="tab('r')">📋 Заявки</button>
<button id="tabS" class="tab" onclick="tab('s')">⚙️ Настройки</button>
<button class="gray" onclick="shareCatalog()">📤 Каталог</button>
<button class="gray" onclick="logout()">Выход</button>
</div>
<div id="msg"></div>
<div id="sec-p">
<h2>Новый товар</h2>
<input id="f_article" placeholder="Артикул *">
<input id="f_name" placeholder="Название *">
<input id="f_price" type="number" placeholder="Цена *">
<input id="f_stock" type="number" placeholder="Наличие">
<input id="f_category" placeholder="Категория">
<input id="f_brand" placeholder="Бренд">
<input id="f_car" placeholder="Марка авто">
<div style="margin:10px 0"><label style="font-weight:700">📷 Фото товара</label> <span style="color:#888;font-size:12px">(файл с ПК/телефона, сожмётся при загрузке)</span><br><input type="file" id="f_file" accept="image/*" style="width:auto;margin:6px 0" onchange="prepPhoto(this)"><br><img id="f_prev" style="max-height:70px;border-radius:8px;margin-top:4px" hidden><input type="hidden" id="f_photo_url"></div><button onclick="saveProd()">Сохранить</button>
<h2>Список товаров</h2>
<div id="plist"></div>
<div class="card">
<h2>📥 Импорт Excel</h2>
<input type="file" id="f_file" accept=".xlsx,.xls">
<button onclick="doImport()">Импортировать</button>
<div style="margin:10px 0;padding:10px;background:#f5f5f5;border-radius:10px">
<h3>🔄 Откаты</h3>
<button onclick="undoImport()">Отменить импорт</button>
<select id="bk_list" style="margin:0 6px"></select><button onclick="doRestore()">Восстановить из бэкапа</button>
<button onclick="resetSettings()">Сбросить настройки</button>
</div>
<button class="gray" onclick="dlTemplate()">Скачать шаблон</button>
<div id="imp_rep"></div>
</div>
</div>
<div id="sec-r" class="hide">
<h2>VIN-заявки</h2>
<div id="rlist"></div>
</div>
<div id="sec-s" class="hide">
<h2>Настройки</h2>
<input id="s_brand" placeholder="Название бренда">
<input id="s_phone" placeholder="Телефон">
<input id="s_contact" placeholder="Контакты (TG)">
<input id="s_about" placeholder="О компании">
<input id="s_pass" type="password" placeholder="Новый пароль (если сменить, мин. 8 символов)">
<input id="s_pass2" type="password" placeholder="Повторите новый пароль">
<button onclick="saveS()">Сохранить настройки</button>
<div id="brand_block" style="margin:12px 0;padding:12px;background:#f5f5f5;border-radius:10px"><h3>🎨 Бренд и внешний вид</h3><input id="b_shop" placeholder="Название магазина" style="width:100%;margin:4px 0"><input id="b_slogan" placeholder="Слоган" style="width:100%;margin:4px 0"><textarea id="b_phone" rows="2" placeholder="Телефоны (по одному в строке)" style="width:100%;margin:4px 0"></textarea><input id="b_hero" placeholder="URL картинки hero" style="width:100%;margin:4px 0"><div style="margin:6px 0">Основной <input type="color" id="b_c1"> Акцентный <input type="color" id="b_c2"></div><button onclick="saveBrand()">Сохранить внешний вид</button></div>
</div>
</div>
<script>
var PASS=sessionStorage.getItem('apass')||'';
var editId=null;
function hdr(){return {'Content-Type':'application/json','x-admin-pass':PASS};}
function doLogin(){
PASS=document.getElementById('pass').value;
fetch('/admin/products',{headers:hdr()}).then(function(r){
if(r.ok){sessionStorage.setItem('apass',PASS);show();}
else{document.getElementById('lerr').textContent='Неверный пароль';}
});
}
function logout(){sessionStorage.removeItem('apass');location.reload();}
function show(){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');loadP();loadR();checkPass();}
function tab(t){
document.getElementById('sec-p').classList.toggle('hide',t!='p');
document.getElementById('sec-r').classList.toggle('hide',t!='r');
document.getElementById('sec-s').classList.toggle('hide',t!='s');
document.getElementById('tabP').classList.toggle('active',t=='p');
document.getElementById('tabR').classList.toggle('active',t=='r');
document.getElementById('tabS').classList.toggle('active',t=='s');
if(t=='s')loadS();
}
function msg(t,ok){var m=document.getElementById('msg');m.innerHTML='<div class="'+(ok?'ok':'err')+'">'+t+'</div>';setTimeout(function(){m.innerHTML='';},3000);}
function clearForm(){
['f_article','f_name','f_price','f_stock','f_category','f_brand','f_car'].forEach(function(i){document.getElementById(i).value='';});
editId=null;
}
function loadP(){
fetch('/admin/products',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
if(a.error){msg(a.error,false);return;}
document.getElementById('plist').innerHTML=a.map(function(p){
return '<div class="card"><div class="row"><b>'+p.article+'</b> — '+p.name+'</div><div class="row">'+(p.car_brand||'')+' · '+(p.brand||'')+' · '+p.price+' ₽ · налич:'+p.stock+'</div><button class="gray" onclick="editProd('+p.id+')">Ред.</button><button class="red" onclick="delProd('+p.id+')">Удалить</button><button class="gray" onclick="copyLink(\''+p.article+'\')">🔗</button><button class="gray" onclick="shareTg(\''+p.article+'\')">📤</button></div>';
}).join('')||'<p>Пусто</p>';
});
}
function saveProd(){
var b={
article:document.getElementById('f_article').value.trim(),
name:document.getElementById('f_name').value.trim(),
price:document.getElementById('f_price').value===''?null:Number(document.getElementById('f_price').value),
stock:document.getElementById('f_stock').value===''?0:Number(document.getElementById('f_stock').value),
category:document.getElementById('f_category').value.trim()||null,
brand:document.getElementById('f_brand').value.trim()||null,
car_brand:document.getElementById('f_car').value.trim()||null,
photo_url:document.getElementById('f_photo_url').value||null,
description:(document.getElementById('f_desc')?document.getElementById('f_desc').value:'')||null
};
var url='/admin/products',method='POST';
if(editId){url='/admin/products/'+editId;method='PUT';}
fetch(url,{method:method,headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){
if(d.ok){msg('Сохранено',true);clearForm();loadP();}
else{msg(d.error||'Ошибка',false);}
});
}
function delProd(id){
if(!confirm('Удалить товар?'))return;
fetch('/admin/products/'+id,{method:'DELETE',headers:hdr()}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg('Удалено',true);loadP();}});
}
function editProd(id){
fetch('/admin/products',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
var p=null;
for(var i=0;i<a.length;i++){if(a[i].id==id)p=a[i];}
if(!p)return;
editId=id;
document.getElementById('f_article').value=p.article;
document.getElementById('f_name').value=p.name;
document.getElementById('f_price').value=p.price;
document.getElementById('f_stock').value=p.stock;
document.getElementById('f_category').value=p.category||'';
document.getElementById('f_brand').value=p.brand||'';
document.getElementById('f_car').value=p.car_brand||'';
msg('Редактирование #'+id+' — измените и нажмите Сохранить',true);
window.scrollTo(0,0);
});
}
function loadR(){
fetch('/admin/requests',{headers:hdr()}).then(function(r){return r.json();}).then(function(a){
document.getElementById('rlist').innerHTML=a.map(function(x){
return '<div class="card"><div class="row"><b>#'+x.id+'</b> '+x.type+' · '+x.status+'</div><div class="row">VIN: '+(x.vin||'—')+'</div><div class="row">'+x.description+'</div><div class="row">Контакт: '+(x.contact||'—')+'</div><button class="red" onclick="delReq('+x.id+')">Удалить</button></div>';
}).join('')||'<p>Пусто</p>';
});
}
function delReq(id){
if(!confirm('Удалить заявку?'))return;
fetch('/admin/requests/'+id,{method:'DELETE',headers:hdr()}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg('Удалено',true);loadR();}});
}
function prodUrl(a){return 'https://zap.prostors.ru/catalog.html?article='+encodeURIComponent(a);}
function copyLink(a){var u=prodUrl(a);if(navigator.clipboard){navigator.clipboard.writeText(u).then(function(){msg('Ссылка скопирована',true);});}else{prompt('Скопируйте ссылку:',u);}}
function shareTg(a){var u=prodUrl(a);window.open('https://t.me/share/url?url='+encodeURIComponent(u)+'&text='+encodeURIComponent('Запчасть: '+a),'_blank');}
function shareCatalog(){window.open('https://t.me/share/url?url='+encodeURIComponent('https://zap.prostors.ru/catalog.html?v=5')+'&text='+encodeURIComponent('Каталог автозапчастей'),'_blank');}
function loadS(){
fetch('/admin/settings',{headers:hdr()}).then(function(r){return r.json();}).then(function(s){
document.getElementById('s_brand').value=s.brand_name||'';
document.getElementById('s_phone').value=s.phone||'';
document.getElementById('s_contact').value=s.contact_info||'';
document.getElementById('s_about').value=s.about||'';
});
}
function saveS(){
var b={brand_name:document.getElementById('s_brand').value,phone:document.getElementById('s_phone').value,contact_info:document.getElementById('s_contact').value,about:document.getElementById('s_about').value};
var np=document.getElementById('s_pass').value.trim();
if(np)b.new_password=np;
fetch('/admin/settings',{method:'POST',headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){
if(d.ok){msg('Настройки сохранены',true);document.getElementById('s_pass').value='';}
else{msg(d.error||'Ошибка',false);}
});
}
function doImport(){
var f=document.getElementById('f_file').files[0];
if(!f){msg('Выберите файл',false);return;}
var fd=new FormData();
fd.append('file',f);
fetch('/admin/import-excel',{method:'POST',headers:{'x-admin-pass':PASS},body:fd}).then(function(r){return r.json();}).then(function(d){
if(d.errors!==undefined){
document.getElementById('imp_rep').innerHTML='<div class="ok">Вставлено: '+d.inserted+' · Обновлено: '+d.updated+'</div>'+(d.errors.length?'<div class="err">Ошибки: '+d.errors.map(function(e){return 'стр.'+e.row+': '+e.error;}).join('; ')+'</div>':'');
loadP();
}else{msg(d.error||'Ошибка',false);}
});
}
function dlTemplate(){
fetch('/admin/excel-template',{headers:hdr()}).then(function(r){return r.blob();}).then(function(b){
var a=document.createElement('a');
a.href=URL.createObjectURL(b);
a.download='template.xlsx';
a.click();
});
}
function checkPass(){fetch("/admin/settings",{headers:hdr()}).then(function(r){return r.json();}).then(function(x){document.getElementById("pwbanner").classList.toggle("hide",!!x.has_pass);});}
function saveS(){var np=document.getElementById("s_pass").value.trim();var np2=document.getElementById("s_pass2").value.trim();if(np){if(np.length<8){msg("Пароль минимум 8 символов",false);return;}if(np!==np2){msg("Пароли не совпадают",false);return;}}var b={brand_name:document.getElementById("s_brand").value,phone:document.getElementById("s_phone").value,contact_info:document.getElementById("s_contact").value,about:document.getElementById("s_about").value};if(np)b.new_password=np;fetch("/admin/settings",{method:"POST",headers:hdr(),body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){if(d.ok){msg("Настройки сохранены",true);document.getElementById("s_pass").value="";document.getElementById("s_pass2").value="";checkPass();}else{msg(d.error||"Ошибка",false);}});}
if(PASS)show();
function loadBackups(){fetch('/admin/backups',{headers:{'Content-Type':'application/json','x-admin-pass':PASS}}).then(function(r){return r.json();}).then(function(d){var s=document.getElementById('bk_list');if(!s)return;s.innerHTML='';(d.files||[]).forEach(function(f){var o=document.createElement('option');o.value=f;o.textContent=f;s.appendChild(o);});});}
function undoImport(){if(!confirm('Отменить последний импорт?'))return;fetch('/admin/restore',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS},body:JSON.stringify({file:'pre-import.db'})}).then(function(){msg('Восстановление… контейнер перезапускается',true);setTimeout(function(){location.reload();},5000);});}
function doRestore(){var f=document.getElementById('bk_list').value;if(!f){msg('Выберите бэкап',false);return;}if(!confirm('Восстановить '+f+'?'))return;fetch('/admin/restore',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS},body:JSON.stringify({file:f})}).then(function(){msg('Восстановление… контейнер перезапускается',true);setTimeout(function(){location.reload();},5000);});}
function resetSettings(){if(!confirm('Сбросить настройки витрины к дефолту?'))return;fetch('/admin/reset-settings',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS}}).then(function(r){return r.json();}).then(function(){msg('Настройки сброшены',true);});}
if(PASS)loadBackups();
setInterval(function(){if(PASS&&document.getElementById('bk_list')&&document.getElementById('bk_list').options.length===0)loadBackups();},3000);
function loadBrand(){fetch('/api/config').then(function(r){return r.json();}).then(function(c){window._cfg=c;document.getElementById('b_shop').value=c.shop_name||'';document.getElementById('b_slogan').value=c.slogan||'';document.getElementById('b_phone').value=c.phone||'';document.getElementById('b_hero').value=c.hero_url||'';document.getElementById('b_c1').value=c.color_primary||'#667eea';document.getElementById('b_c2').value=c.color_accent||'#764ba2';});}
function saveBrand(){var c=window._cfg||{};var b={shop_name:document.getElementById('b_shop').value,slogan:document.getElementById('b_slogan').value,phone:document.getElementById('b_phone').value.split('\n').map(function(x){return x.trim();}).filter(Boolean).join('\n'),contact_info:c.contact_info,about:c.about,payment_text:c.payment_text,delivery_text:c.delivery_text,hero_url:document.getElementById('b_hero').value,color_primary:document.getElementById('b_c1').value,color_accent:document.getElementById('b_c2').value,car_brands:c.car_brands||[],categories:c.categories||[]};fetch('/admin/config',{method:'POST',headers:{'Content-Type':'application/json','x-admin-pass':PASS},body:JSON.stringify(b)}).then(function(r){return r.json();}).then(function(d){if(d.ok){alert('Внешний вид сохранён');}else{alert(d.error||'Ошибка');}});}
if(PASS)loadBrand();
var DEMO=location.search.indexOf('demo=1')>=0;
if(DEMO){
var _f=window.fetch;window.fetch=function(u,o){o=o||{};o.headers=o.headers||{};o.headers['x-demo']='1';return _f(u,o);};
document.body.insertAdjacentHTML('afterbegin','<div style="background:#e6a000;color:#fff;text-align:center;padding:8px;font-weight:700;position:sticky;top:0;z-index:99">🔒 Демо-режим (просмотр). Полный доступ — по паролю.</div>');
setTimeout(function(){show();},300);
setTimeout(function(){document.querySelectorAll('button,input,textarea').forEach(function(el){var t=((el.textContent||'')+(el.placeholder||''));if(/Сохранить|Удалить|Импорт|Отменить|Восстановить|Сбросить|Новый пароль/i.test(t))el.disabled=true;});},1200);
}

if(DEMO){
document.addEventListener('click',function(e){var el=e.target.closest?e.target.closest('button'):null;if(el&&/Сохранить|Удалить|Импорт|Отменить|Восстановить|Сбросить/.test(el.textContent||'')){e.preventDefault();e.stopPropagation();alert('🔒 Демо-режим: изменения отключены');}},true);
setInterval(function(){document.querySelectorAll('button').forEach(function(el){if(/Сохранить|Удалить|Импорт|Отменить|Восстановить|Сбросить/.test(el.textContent||'')){el.disabled=true;el.style.opacity=0.5;}});},2000);
}

function prepPhoto(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var k=Math.min(1,900/Math.max(img.width,img.height));var c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(function(bl){var fd=new FormData();fd.append('photo',bl,'photo.jpg');fetch('/admin/upload',{method:'POST',headers:{'x-admin-pass':PASS},body:fd}).then(function(r){return r.json();}).then(function(d){if(d.url){document.getElementById('f_photo_url').value=d.url;var pv=document.getElementById('f_prev');pv.src=d.url;pv.hidden=false;ztoast('📷 Фото загружено и сжато');}else{alert(d.error||'Ошибка фото');}});},'image/jpeg',0.78);};img.src=e.target.result;};r.readAsDataURL(f);}
function refreshProds(cb){fetch('/admin/products',{headers:{'x-admin-pass':PASS}}).then(function(r){return r.json();}).then(function(d){window._prods=d.items||d;if(cb)cb();});}
var _ep=window.editProd;window.editProd=function(id){_ep(id);refreshProds(function(){var p=null;(window._prods||[]).forEach(function(x){if(x.id===id)p=x;});var pv=document.getElementById('f_prev');if(p&&p.photo_url){document.getElementById('f_photo_url').value=p.photo_url;pv.src=p.photo_url;pv.hidden=false;}else{document.getElementById('f_photo_url').value='';pv.hidden=true;}});};
(function(){var L=[['b_shop','Название магазина — шапка витрины и каталога'],['b_slogan','Слоган — под названием на витрине'],['b_phone','Телефоны — вкладка «Инфо» каталога, по одному в строке'],['b_hero','Hero-картинка — главный экран витрины'],['b_c1','Основной цвет — шапка, кнопки'],['b_c2','Акцентный цвет — акценты, цены']];L.forEach(function(x){var el=document.getElementById(x[0]);if(el)el.insertAdjacentHTML('beforebegin','<div style="font-size:12px;color:#556;margin:10px 0 2px;font-weight:600">'+x[1]+'</div>');});})();

var _ft=window.fetch;window.fetch=function(u,o){var r=_ft(u,o);r.then(function(x){if(x.ok&&o&&o.method&&o.method!=='GET'){var uu=String(u);if(uu.indexOf('/admin/products')>=0)ztoast('✅ Товар сохранён');else if(uu.indexOf('/admin/config')>=0)ztoast('✅ Сохранено');else if(uu.indexOf('/admin/upload')>=0)ztoast('📷 Фото на сервере');}}).catch(function(){});return r;};/*fetch_toast*/

function prepHero(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(e){var img=new Image();img.onload=function(){var k=Math.min(1,1200/Math.max(img.width,img.height));var cv=document.createElement('canvas');cv.width=Math.round(img.width*k);cv.height=Math.round(img.height*k);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);cv.toBlob(function(bl){var fd=new FormData();fd.append('photo',bl,'hero.jpg');fetch('/admin/upload',{method:'POST',headers:{'x-admin-pass':PASS},body:fd}).then(function(r){return r.json();}).then(function(d){if(d.url){document.getElementById('b_hero').value=d.url;var pv=document.getElementById('b_hero_prev');pv.src=d.url;pv.hidden=false;msg('🖼 Hero загружен и сжат',true);}else{msg(d.error||'Ошибка',false);}});},'image/jpeg',0.8);};img.src=e.target.result;};r.readAsDataURL(f);}
(function(){var hb=document.getElementById('b_hero');if(hb&&!document.getElementById('b_hero_file'))hb.insertAdjacentHTML('afterend','<div style="margin:6px 0"><input type="file" id="b_hero_file" accept="image/*" style="width:auto"><img id="b_hero_prev" style="max-height:60px;border-radius:8px;margin-left:8px" hidden></div>'),document.getElementById('b_hero_file').onchange=function(){prepHero(this);};var _lb=window.loadBrand;window.loadBrand=function(){_lb();setTimeout(function(){var u=document.getElementById('b_hero').value;var pv=document.getElementById('b_hero_prev');if(u&&pv){pv.src=u;pv.hidden=false;}},300);};})();

(function(){/*ux_labels*/
var L=[['f_article','Артикул * — по нему ищут в каталоге'],['f_name','Название * — видно в карточке'],['f_price','Цена, ₽ *'],['f_stock','Наличие, шт (0 = под заказ)'],['f_category','Категория — фильтр каталога'],['f_brand','Бренд'],['f_car','Марка авто — для подбора'],['s_brand','Название магазина — шапка витрины и каталога'],['s_phone','Телефон — вкладка «Инфо» каталога'],['s_contact','Контакты (TG) — кнопка связи'],['s_about','О компании — вкладка «Инфо»'],['s_pass','Новый пароль (мин. 8 символов)'],['s_pass2','Повторите новый пароль']];
L.forEach(function(x){var el=document.getElementById(x[0]);if(el)el.insertAdjacentHTML('beforebegin','<div style="font-size:12px;color:#556;margin:8px 0 2px;font-weight:600">'+x[1]+'</div>');});
var fc=document.getElementById('f_car');if(fc&&!document.getElementById('f_desc'))fc.insertAdjacentHTML('afterend','<div style="font-size:12px;color:#556;margin:8px 0 2px;font-weight:600">Описание товара — видно в карточке каталога</div><textarea id="f_desc" rows="2" style="width:100%;padding:10px;border:1px solid #d8dce6;border-radius:10px"></textarea>');
document.querySelectorAll('button').forEach(function(b){var oc=b.getAttribute('onclick')||'';if(oc.indexOf('copyLink')>=0)b.title='Скопировать ссылку на товар';if(oc.indexOf('shareTg')>=0)b.title='Переслать карточку в Telegram';});
var _ep2=window.editProd;window.editProd=function(id){_ep2(id);var h=document.querySelector('h2');if(h&&h.textContent.indexOf('Новый товар')>=0)h.textContent='Редактирование товара';setTimeout(function(){var p=null;(window._prods||[]).forEach(function(x){if(x.id===id)p=x;});var d=document.getElementById('f_desc');if(d)d.value=(p&&p.description)||'';},400);};
var _sp2=window.saveProd;window.saveProd=function(){_sp2();setTimeout(function(){var h=document.querySelector('h2');if(h&&h.textContent.indexOf('Редактирование')>=0)h.textContent='Новый товар';},800);};
})();

/*edit_hard*/window.editProd=function(id){function fill(){var p=null;(window._prods||[]).forEach(function(x){if(x.id===id)p=x;});if(!p)return;window.editId=id;document.getElementById('f_article').value=p.article||'';document.getElementById('f_name').value=p.name||'';document.getElementById('f_price').value=p.price==null?'':p.price;document.getElementById('f_stock').value=p.stock==null?'':p.stock;document.getElementById('f_category').value=p.category||'';document.getElementById('f_brand').value=p.brand||'';document.getElementById('f_car').value=p.car_brand||'';var d=document.getElementById('f_desc');if(d)d.value=p.description||'';var pv=document.getElementById('f_prev');if(pv){if(p.photo_url){document.getElementById('f_photo_url').value=p.photo_url;pv.src=p.photo_url;pv.hidden=false;}else{document.getElementById('f_photo_url').value='';pv.hidden=true;}}var h=document.querySelector('h2');if(h)h.textContent='Редактирование: '+(p.article||id);msg('Редактирование '+(p.article||'')+' — измените и нажмите Сохранить',true);window.scrollTo(0,0);}if(window._prods){fill();}else{fetch('/admin/products',{headers:{'x-admin-pass':PASS}}).then(function(r){return r.json();}).then(function(dd){window._prods=dd.items||dd;fill();});}};

function ztoast(m){var t=document.getElementById('ztoast');if(!t){t=document.createElement('div');t.id='ztoast';t.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 22px;border-radius:24px;font-size:14px;z-index:9999;box-shadow:0 4px 14px rgba(0,0,0,.4)';document.body.appendChild(t);}t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(function(){t.style.display='none';},3000);}
var _sp3=window.saveProd;window.saveProd=function(){_sp3();setTimeout(function(){['f_article','f_name','f_price','f_stock','f_category','f_brand','f_car'].forEach(function(i){var e=document.getElementById(i);if(e)e.value='';});var d=document.getElementById('f_desc');if(d)d.value='';var pu=document.getElementById('f_photo_url');if(pu)pu.value='';var pv=document.getElementById('f_prev');if(pv)pv.hidden=true;var ff=document.getElementById('f_file');if(ff)ff.value='';window.editId=null;var h=document.querySelector('h2');if(h)h.textContent='Новый товар';ztoast('✅ Товар сохранён');},700);};
(function(){var d=document.getElementById('f_desc');if(d){d.rows=4;d.style.minHeight='110px';d.style.fontSize='14px';}})();
</script>
